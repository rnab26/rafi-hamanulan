<!doctype html>
<!-- Image d'aperçu des liens (WhatsApp, Facebook, Google) : 1200x630 → public/img/og-rafi.jpg.
     Rendu : node _build/og/render.js. Textes = réglages de build.py (NAME, PHONE, ETA_MIN, zone) : à modifier ici aussi s'ils changent. -->
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Rubik;font-weight:400 700;src:url(../../public/fonts/rubik-hebrew.woff2) format('woff2');unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:Rubik;font-weight:400 700;src:url(../../public/fonts/rubik-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Rubik,sans-serif;color:#fff;background:linear-gradient(135deg,#071F4F 0%,#0B4FBF 58%,#0071E3 100%);display:flex;position:relative}
.txt{flex:1;padding:54px 64px 0 40px;display:flex;flex-direction:column;position:relative;z-index:2}
.brand{display:flex;align-items:center;gap:16px;font-size:24px;opacity:.92;letter-spacing:.3px}
.brand img{width:64px;height:64px;border-radius:16px;background:#fff;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
h1{font-size:100px;font-weight:700;line-height:1.02;margin-top:30px;letter-spacing:-1px}
.sub{font-size:32px;margin-top:12px;opacity:.92}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.chip{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:500;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22)}
.chip svg{width:30px;height:30px;fill:#FFD54A}
.chip b{color:#FFD54A;font-weight:700}
.phone{margin-top:34px;align-self:flex-start;display:flex;align-items:center;gap:16px;background:#fff;color:#0B3D91;font-size:52px;font-weight:700;padding:14px 34px 14px 30px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.28);direction:ltr}
.phone svg{width:44px;height:44px;fill:#18A957}
.pic{width:470px;height:630px;position:relative;flex:none}
.pic img{width:100%;height:100%;object-fit:cover;object-position:32% 40%}
.pic::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,rgba(7,31,79,0) 70%,rgba(7,31,79,.0) 100%),linear-gradient(to right,rgba(11,79,191,0) 72%,rgba(11,79,191,.9) 100%)}
</style></head><body>
<div class="txt">
  <div class="brand"><img src="../../public/img/logo.png" alt=""><span>rafihamanulan.co.il</span></div>
  <h1>רפי המנעולן</h1>
  <p class="sub">מנעולן בשרון · מקיסריה ועד רמת השרון</p>
  <div class="chips">

<div class="pic"><img src="../../marketing/profil/rafi-profil-800.jpg" alt=""></div>
</body></html>
