<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="פריצת דלתות, צילינדרים, מנעולים וכספות">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEF3FE"/><stop offset="1" stop-color="#D6E3FB"/></linearGradient>
<linearGradient id="door" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#33435F"/><stop offset="1" stop-color="#24324A"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F7FB"/><stop offset=".5" stop-color="#C9D3E1"/><stop offset="1" stop-color="#9FAEC3"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC24D"/><stop offset="1" stop-color="#F09A14"/></linearGradient>
<linearGradient id="safe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2638"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0E1A2B" flood-opacity=".22"/></filter>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<circle cx="640" cy="150" r="190" fill="#1A56DB" opacity=".08"/>
<circle cx="140" cy="690" r="150" fill="#1A56DB" opacity=".07"/>
<!-- sol -->
<ellipse cx="400" cy="700" rx="300" ry="26" fill="#0E1A2B" opacity=".08"/>
<!-- porte blindée -->
<g filter="url(#sh)">
<rect x="250" y="110" width="300" height="590" rx="10" fill="#1B2638"/>
<rect x="266" y="126" width="268" height="574" rx="6" fill="url(#door)"/>
<rect x="296" y="160" width="208" height="210" rx="8" fill="none" stroke="#47597A" stroke-width="5"/>
<rect x="296" y="420" width="208" height="240" rx="8" fill="none" stroke="#47597A" stroke-width="5"/>
<!-- plaque + poignée -->
<rect x="470" y="372" width="40" height="150" rx="20" fill="url(#steel)"/>
<rect x="404" y="398" width="94" height="22" rx="11" fill="url(#steel)"/>
<circle cx="490" cy="409" r="14" fill="#E9EEF5" stroke="#9FAEC3" stroke-width="3"/>
<!-- cylindre -->
<circle cx="490" cy="480" r="13" fill="#0E1A2B"/><rect x="485" y="480" width="10" height="24" rx="4" fill="#0E1A2B"/>
</g>
<!-- clé dorée -->
<g transform="translate(560 250) rotate(-28)" filter="url(#sh)">
<circle cx="0" cy="0" r="46" fill="url(#gold)"/><circle cx="0" cy="0" r="18" fill="#EEF3FE"/>
<rect x="40" y="-11" width="150" height="22" rx="6" fill="url(#gold)"/>
<rect x="146" y="10" width="14" height="26" rx="3" fill="url(#gold)"/><rect x="172" y="10" width="14" height="18" rx="3" fill="url(#gold)"/>
</g>
<!-- cylindre européen -->
<g transform="translate(70 300)" filter="url(#sh)">
<rect x="0" y="0" width="190" height="62" rx="31" fill="url(#steel)"/>
<rect x="30" y="40" width="130" height="58" rx="10" fill="url(#steel)"/>
<rect x="88" y="-6" width="16" height="74" rx="4" fill="#24324A"/>
<circle cx="34" cy="31" r="15" fill="#33435F"/><rect x="30" y="31" width="8" height="18" rx="3" fill="#33435F"/>
<circle cx="156" cy="31" r="15" fill="#33435F"/><rect x="152" y="31" width="8" height="18" rx="3" fill="#33435F"/>
</g>
<!-- coffre-fort -->
<g transform="translate(560 470)" filter="url(#sh)">
<rect x="0" y="0" width="190" height="190" rx="18" fill="url(#safe)"/>
<rect x="16" y="16" width="158" height="158" rx="10" fill="none" stroke="#33435F" stroke-width="4"/>
<circle cx="95" cy="88" r="38" fill="#24324A" stroke="url(#steel)" stroke-width="7"/>
<g stroke="#C9D3E1" stroke-width="4" stroke-linecap="round"><path d="M95 56v10"/><path d="M95 110v10"/><path d="M63 88h10"/><path d="M117 88h10"/></g>
<circle cx="95" cy="88" r="10" fill="url(#steel)"/>
<rect x="70" y="140" width="50" height="12" rx="6" fill="url(#steel)"/>
<rect x="20" y="186" width="30" height="10" rx="3" fill="#0B1220"/><rect x="140" y="186" width="30" height="10" rx="3" fill="#0B1220"/>
</g>
<!-- étincelles « neuf » -->
<g fill="#1A56DB" opacity=".55"><path d="M210 190l6 16 16 6-16 6-6 16-6-16-16-6 16-6z"/><path d="M700 400l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/></g>
</svg>
